services:
  - type: web
    name: banking-system
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: banking-db
          property: jdbcConnectionString
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: banking-db
    plan: free
