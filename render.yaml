services:
  - type: web
    name: banking-system
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: banking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: banking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: banking-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: banking-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: banking-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: banking-db
    plan: free
