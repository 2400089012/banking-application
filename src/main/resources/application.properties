server.port=${PORT:8080}

# Database Configuration (Defaults to SQLite for local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:banking.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security
jwt.secret=${JWT_SECRET:supersecretjwtkeyforbankingapplication2026version}
jwt.expiration=3600000
