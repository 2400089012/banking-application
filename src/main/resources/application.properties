server.port=${PORT:8080}

# Database Configuration (Defaults to SQLite for local development)
# On Render, we use the specific Postgres properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:banking.db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}

# Security
jwt.secret=${JWT_SECRET:supersecretjwtkeyforbankingapplication2026version}
jwt.expiration=3600000
