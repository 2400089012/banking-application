server.port=${PORT:8080}

# Database Configuration
# We use separate properties for maximum compatibility across different environments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:banking.db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate 6 will auto-detect the dialect from the JDBC connection
# We only set it if explicitly provided via env var
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}

# Security
jwt.secret=${JWT_SECRET:supersecretjwtkeyforbankingapplication2026version}
jwt.expiration=3600000
